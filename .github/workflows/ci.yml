name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Install & Deploy (Render)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: ./server
        run: npm install

      - name: Trigger Render deploy on main
        if: github.ref == 'refs/heads/main'
        run: |
          curl -v -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  frontend:
    name: Frontend Build & Deploy (Vercel)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies & Build
        working-directory: ./client
        run: |
          npm install --no-audit --no-fund
          CI=false npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Deploy Preview for non-main branches
      - name: Deploy to Vercel (preview on non-main)
        if: github.ref != 'refs/heads/main'
        working-directory: ./client
        run: vercel --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Deploy Production for main branch
      - name: Deploy to Vercel (production on main)
        if: github.ref == 'refs/heads/main'
        working-directory: ./client
        run: vercel --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}